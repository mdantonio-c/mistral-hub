# Shared configuration for the four specialized workers.
x-celery-worker: &celery-worker
  build:
    args:
      CURRENT_GID: ${CURRENT_GID}
      CURRENT_UID: ${CURRENT_UID}
      RAPYDO_VERSION: ${RAPYDO_VERSION}
    context: ./projects/mistral/builds/backend
  entrypoint:
    - docker-entrypoint-celery
  environment: &celery-worker-environment
    ACTIVATE: "1"
    APP_MODE: ${APP_MODE}

    ALCHEMY_DB: ${ALCHEMY_DB:-SQL_API}
    ALCHEMY_DBTYPE: ${ALCHEMY_DBTYPE:-postgresql}
    ALCHEMY_ENABLE_CONNECTOR: ${ALCHEMY_ENABLE_CONNECTOR:-1}
    ALCHEMY_EXPIRATION_TIME: ${ALCHEMY_EXPIRATION_TIME:-7200}
    ALCHEMY_HOST: ${ALCHEMY_HOST:-sql.dockerized.io}
    ALCHEMY_PORT: ${ALCHEMY_PORT:-5432}
    ALCHEMY_USER: ${ALCHEMY_USER:-sqluser}
    ALCHEMY_PASSWORD: ${ALCHEMY_PASSWORD:?ALCHEMY_PASSWORD is required}
    ALCHEMY_POOLSIZE: ${ALCHEMY_POOLSIZE:-30}
    ALCHEMY_VERIFICATION_TIME: ${ALCHEMY_VERIFICATION_TIME:-900}

    CELERYBEAT_ENABLED: ${CELERYBEAT_ENABLED:-1}
    CELERY_BACKEND_SERVICE: ${CELERY_BACKEND}
    CELERY_BROKER_SERVICE: ${CELERY_BROKER}
    CELERY_ENABLE: ${CELERY_ENABLE:-1}
    CELERY_EXPIRATION_TIME: ${CELERY_EXPIRATION_TIME:-7200}
    CELERY_VERIFICATION_TIME: ${CELERY_VERIFICATION_TIME:-900}

    CURRENT_GID: ${CURRENT_GID}
    CURRENT_UID: ${CURRENT_UID}
    DATA_PATH: ${DATA_PATH:-/data}
    DEBUG_LEVEL: ${LOG_LEVEL:-INFO}
    DOMAIN: ${PROJECT_DOMAIN:-localhost}
    EXTENDED_PACKAGE: no_extended_project
    GRACE_PERIOD: ${GRACE_PERIOD:-2}
    HOME: /home/developer
    LASTDAYS: ${LASTDAYS:-10}
    LOG_RETENTION: ${LOG_RETENTION:-180}
    MAIN_LOGIN_ENABLE: ${MAIN_LOGIN_ENABLE:-1}
    PLATFORM: ${PLATFORM}
    PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}

    RABBITMQ_ENABLE: ${RABBITMQ_ENABLE:-1}
    RABBITMQ_EXCHANGE: ""
    RABBITMQ_EXPIRATION_TIME: ${RABBITMQ_EXPIRATION_TIME:-7200}
    RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbit.dockerized.io}
    RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
    RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    RABBITMQ_ROUTING_KEY: ""
    RABBITMQ_SSL_ENABLED: ${RABBITMQ_SSL_ENABLED:-0}
    RABBITMQ_VERIFICATION_TIME: ${RABBITMQ_VERIFICATION_TIME:-900}
    RABBITMQ_VHOST: ${RABBITMQ_VHOST}

    REDIS_ENABLE: ${REDIS_ENABLE:-1}
    REDIS_ENABLE_CONNECTOR: ${REDIS_ENABLE_CONNECTOR:-1}
    REDIS_EXPIRATION_TIME: ${REDIS_EXPIRATION_TIME:-86400}
    REDIS_HOST: ${REDIS_HOST:-redis.dockerized.io}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    REDIS_VERIFICATION_TIME: ${REDIS_VERIFICATION_TIME:-3600}

    SMTP_ADMIN: ${SMTP_ADMIN:?SMTP_ADMIN is required}
    SMTP_ENABLE: ${SMTP_ENABLE:-1}
    SMTP_ENABLE_CONNECTOR: ${SMTP_ENABLE_CONNECTOR:-1}
    SMTP_EXPIRATION_TIME: ${SMTP_EXPIRATION_TIME:-7200}
    SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
    SMTP_PORT: ${SMTP_PORT}
    SMTP_NOREPLY: ${SMTP_NOREPLY}
    SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
    SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
    SMTP_REPLYTO: ${SMTP_REPLYTO}
    SMTP_VERIFICATION_TIME: ${SMTP_VERIFICATION_TIME:-900}

    SSL_FORCE_SELF_SIGNED: ${SSL_FORCE_SELF_SIGNED:-0}
  healthcheck:
    interval: 1m0s
    retries: 3
    start_period: 5m0s
    test:
      - CMD-SHELL
      - /usr/local/bin/celery-healthcheck
    timeout: 10s
  image: meteohub/backend:${RAPYDO_VERSION}
  restart: always
  volumes:
    - ./submodules/do/controller/confs/projects_defaults.yaml:/code/confs/projects_defaults.yaml
    - ./projects/mistral/project_configuration.yaml:/code/confs/extended_project_configuration.yaml
    - ssl_certs:/etc/letsencrypt
    - ./projects/mistral/backend:/code/mistral
    - ./projects/mistral/backend:/code/no_extended_project
    - ./projects/mistral/project_configuration.yaml:/code/confs/project_configuration.yaml
    - ./projects/mistral/restapi:/usr/local/lib/python3.10/dist-packages/restapi
    - ./data/logs:/logs
    - ./data/user_repo:/data
    - ./data/opendata:/opendata
    - ./data/arkimet:/arkimet/datasets
    - ./data/arkimet_conf:/arkimet/config
  working_dir: /code

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1500"
    ipam: {}
    name: mistral_compose_default
services:
  app:
    environment:
      ACTIVATE: "1"
    image: harbor-ada.hpc.cineca.it/meteo-hub-production/meteo-hub-ui:latest-pre
    ports:
      - "80:80"

  archived_forecast_celery:
    <<: *celery-worker
    command:
      - celery
      - --app
      - restapi.connectors.celery.worker.celery_app
      - worker
      - --concurrency=1
      - -Ofair
      - -Q
      - archived_forecast
      - -n
      - mistral-%h
    environment:
      <<: *celery-worker-environment
      ALCHEMY_ENABLE: ${ALCHEMY_ENABLE:-'1'}
      BACKEND_PREFIX: ${BACKEND_PREFIX:-}
      BACKEND_URL: ${BACKEND_URL:-}

  archived_observed_celery:
    <<: *celery-worker
    command:
      - celery
      - --app
      - restapi.connectors.celery.worker.celery_app
      - worker
      - --concurrency=1
      - -Ofair
      - -Q
      - archived_observed
      - -n
      - mistral-%h
    environment:
      <<: *celery-worker-environment
      ALCHEMY_ENABLE: "1"
      BACKEND_PREFIX: ${BACKEND_PREFIX}
      BACKEND_URL: ${BACKEND_URL}

  backend:
    build:
      args:
        CURRENT_GID: ${CURRENT_GID}
        CURRENT_UID: ${CURRENT_UID}
        RAPYDO_VERSION: ${RAPYDO_VERSION}
      context: ./projects/mistral/builds/backend
    environment:
      ACTIVATE: ${ACTIVATE_BACKEND:-'1'}
      AGGREGATIONS_DSN: ${AGGREGATIONS_DSN}
      AGGREGATIONS_LASTDAYS: ${AGGREGATIONS_LASTDAYS}
      AGGREGATIONS_TRANGES: ${AGGREGATIONS_TRANGES}

      ALCHEMY_DB: ${ALCHEMY_DB:-SQL_API}
      ALCHEMY_DBTYPE: ${ALCHEMY_DBTYPE:-postgresql}
      ALCHEMY_ENABLE: ${ALCHEMY_ENABLE:-'1'}
      ALCHEMY_ENABLE_CONNECTOR: ${ALCHEMY_ENABLE_CONNECTOR:-1}
      ALCHEMY_EXPIRATION_TIME: ${ALCHEMY_EXPIRATION_TIME:-7200}
      ALCHEMY_HOST: ${ALCHEMY_HOST:-sql.dockerized.io}
      ALCHEMY_PASSWORD: ${ALCHEMY_PASSWORD:?ALCHEMY_PASSWORD is required}
      ALCHEMY_POOLSIZE: ${ALCHEMY_POOLSIZE:-30}
      ALCHEMY_PORT: ${ALCHEMY_PORT:-5432}
      ALCHEMY_USER: ${ALCHEMY_USER:-sqluser}
      ALCHEMY_VERIFICATION_TIME: ${ALCHEMY_VERIFICATION_TIME:-900}
      ALEMBIC_AUTO_MIGRATE: ${ALEMBIC_AUTO_MIGRATE:-1}

      ALLOW_ACCESS_TOKEN_PARAMETER: ${ALLOW_ACCESS_TOKEN_PARAMETER:-1}
      ALLOW_PASSWORD_RESET: ${ALLOW_PASSWORD_RESET:-1}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-0}
      API_AUTOSTART: ${API_AUTOSTART:-0}
      APP_MODE: ${APP_MODE:?APP_MODE is required}
      APP_MODULE: restapi.__main__:app
      APP_SECRETS: ${APP_SECRETS:?APP_SECRETS is required}

      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:?AUTH_DEFAULT_PASSWORD is required}
      AUTH_DEFAULT_USERNAME: ${AUTH_DEFAULT_USERNAME?AUTH_DEFAULT_USERNAME is required}
      AUTH_DISABLE_UNUSED_CREDENTIALS_AFTER: ${AUTH_DISABLE_UNUSED_CREDENTIALS_AFTER:-0}
      AUTH_ENABLE: ${AUTH_ENABLE:-1}
      AUTH_FORCE_FIRST_PASSWORD_CHANGE: ${AUTH_FORCE_FIRST_PASSWORD_CHANGE:-0}
      AUTH_JWT_TOKEN_TTL: ${AUTH_JWT_TOKEN_TTL:-2592000}
      AUTH_LOGIN_BAN_TIME: ${AUTH_LOGIN_BAN_TIME:-43200}
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-8}
      AUTH_MAX_PASSWORD_VALIDITY: ${AUTH_MAX_PASSWORD_VALIDITY:-0}
      AUTH_MIN_PASSWORD_LENGTH: ${AUTH_MIN_PASSWORD_LENGTH:-8}
      AUTH_SECOND_FACTOR_AUTHENTICATION: ${AUTH_SECOND_FACTOR_AUTHENTICATION:-0}
      AUTH_SERVICE: ${AUTH_SERVICE:-sqlalchemy}
      AUTH_TOKEN_IP_GRACE_PERIOD: ${AUTH_TOKEN_IP_GRACE_PERIOD:-1800}
      AUTH_TOKEN_SAVE_FREQUENCY: ${AUTH_TOKEN_SAVE_FREQUENCY:-1}

      BACKEND_PREFIX: ${BACKEND_PREFIX}
      BACKEND_URL: ${BACKEND_URL}
      BUILD: 6093ae53

      CELERYBEAT_ENABLED: ${CELERYBEAT_ENABLED:-1}
      CELERY_BACKEND_SERVICE: ${CELERY_BACKEND}
      CELERY_BROKER_SERVICE: ${CELERY_BROKER}
      CELERY_ENABLE: ${CELERY_ENABLE:-1}
      CELERY_ENABLE_CONNECTOR: ${CELERY_ENABLE_CONNECTOR:-1}
      CELERY_EXPIRATION_TIME: ${CELERY_EXPIRATION_TIME:-7200}
      CELERY_VERIFICATION_TIME: ${CELERY_VERIFICATION_TIME:-900}

      CRONTAB_ENABLE: ${CRONTAB_ENABLE:-1}
      CURRENT_GID: ${CURRENT_GID}
      CURRENT_UID: ${CURRENT_UID}
      DATA_IMPORT_FOLDER: ${DATA_IMPORT_FOLDER}
      DATA_PATH: ${DATA_PATH:-/data}
      DOMAIN: ${PROJECT_DOMAIN}
      EXTENDED_PACKAGE: no_extended_project
      FILE_LOGLEVEL: ${FILE_LOGLEVEL:-WARNING}
      FLASK_APP: /usr/local/lib/python3.10/dist-packages/restapi/__main__.py
      FLASK_ENV: ${FLASK_ENV}
      FORCE_PRODUCTION_TESTS: ${FORCE_PRODUCTION_TESTS:-0}
      FRONTEND_PREFIX: ${FRONTEND_PREFIX}
      FRONTEND_URL: ${FRONTEND_URL}

      FTP_ENABLE: ${FTP_ENABLE:-0}
      FTP_ENABLE_CONNECTOR: ${FTP_ENABLE_CONNECTOR:-0}
      FTP_EXPIRATION_TIME: ${FTP_EXPIRATION_TIME:-7200}
      FTP_HOST: ${FTP_HOST:-ftp.dockerized.io}
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD: ${FTP_PASSWORD}
      FTP_PORT: ${FTP_PORT:-21}
      FTP_SSL_ENABLED: ${FTP_SSL_ENABLED:-0}
      FTP_VERIFICATION_TIME: ${FTP_VERIFICATION_TIME:-3600}

      GRACE_PERIOD: ${GRACE_PERIOD:-1800}
      GUNICORN_MAX_NUM_WORKERS: ${GUNICORN_MAX_NUM_WORKERS:-24}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_WORKERS_PER_CORE: ${GUNICORN_WORKERS_PER_CORE:-2}
      GZIP_COMPRESSION_ENABLE: ${GZIP_COMPRESSION_ENABLE:-1}
      GZIP_COMPRESSION_LEVEL: ${GZIP_COMPRESSION_LEVEL:-3}
      GZIP_COMPRESSION_THRESHOLD: ${GZIP_COMPRESSION_THRESHOLD:-1500}
      LASTDAYS: ${LASTDAYS:-10}
      LOGURU_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_RETENTION: ${LOG_RETENTION:-180}
      MAIN_LOGIN_ENABLE: ${MAIN_LOGIN_ENABLE:-1}
      MAX_LOGS_LENGTH: ${MAX_LOGS_LENGTH:-40}

      NEO4J_ENABLE: ${NEO4J_ENABLE:-0}
      NEO4J_ENABLE_CONNECTOR: ${NEO4J_ENABLE_CONNECTOR:-0}
      NEO4J_EXPIRATION_TIME: ${NEO4J_EXPIRATION_TIME:-7200}
      NEO4J_HOST: ${NEO4J_HOST:-matrix.dockerized.io}
      NEO4J_PORT: ${NEO4J_PORT:-7687}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_VERIFICATION_TIME: ${NEO4J_VERIFICATION_TIME:-900}
      NEOMODEL_SLOW_QUERIES: "0.09"

      ON_DATA_READY_DATASETS: ${ON_DATA_READY_DATASETS}
      PLATFORM: ${PLATFORM}
      PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      PROXIED_CONNECTION: ${PROXIED_CONNECTION:-0}
      PYTHONASYNCIODEBUG: ${PYTHONASYNCIODEBUG:-0}
      PYTHONFAULTHANDLER: ${PYTHONFAULTHANDLER:-0}
      PYTHONMALLOC: ${PYTHONMALLOC}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      PYTHON_PATH: ${PYTHON_PATH}

      RABBITMQ_ENABLE: ${RABBITMQ_ENABLE:-1}
      RABBITMQ_ENABLE_CONNECTOR: ${RABBITMQ_ENABLE_CONNECTOR:-1}
      RABBITMQ_EXPIRATION_TIME: ${RABBITMQ_EXPIRATION_TIME:-7200}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbit.dockerized.io}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_SSL_ENABLED: ${RABBITMQ_SSL_ENABLED:-0}
      RABBITMQ_VERIFICATION_TIME: ${RABBITMQ_VERIFICATION_TIME:-900}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}

      REDIS_ENABLE: ${REDIS_ENABLE:-1}
      REDIS_ENABLE_CONNECTOR: ${REDIS_ENABLE_CONNECTOR:-1}
      REDIS_EXPIRATION_TIME: ${REDIS_EXPIRATION_TIME:-86400}
      REDIS_HOST: ${REDIS_HOST:-redis.dockerized.io}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_VERIFICATION_TIME: ${REDIS_VERIFICATION_TIME:-3600}
      REGISTRATION_NOTIFICATIONS: ${REGISTRATION_NOTIFICATIONS:-1}

      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ENABLE: ${S3_ENABLE}
      S3_ENABLE_CONNECTOR: ${S3_ENABLE_CONNECTOR}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_HOST: ${S3_HOST}
      S3_KEY_ID: ${S3_KEY_ID}
      S3_PORT: ${S3_PORT}
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-1}

      SENTRY_URL: ${SENTRY_URL}
      SMTP_ADMIN: ${SMTP_ADMIN:?SMTP_ADMIN is required}
      SMTP_ENABLE: ${SMTP_ENABLE:-1}
      SMTP_ENABLE_CONNECTOR: ${SMTP_ENABLE_CONNECTOR:-1}
      SMTP_EXPIRATION_TIME: ${SMTP_EXPIRATION_TIME:-7200}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_NOREPLY: ${SMTP_NOREPLY}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_REPLYTO: ${SMTP_REPLYTO}
      SMTP_VERIFICATION_TIME: ${SMTP_VERIFICATION_TIME:-900}

      SSL_FORCE_SELF_SIGNED: ${SSL_FORCE_SELF_SIGNED}

    hostname: backend-server
    image: meteohub/backend:${RAPYDO_VERSION}
    logging:
      driver: json-file
    networks:
      default:
        aliases:
          - apiserver.dockerized.io
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./submodules/do/controller/confs/projects_defaults.yaml:/code/confs/projects_defaults.yaml
      - ./projects/mistral/project_configuration.yaml:/code/confs/project_configuration.yaml
      - secrets:/secrets
      - ssl_certs:/etc/letsencrypt
      - data_imports:/imports
      - ./projects/mistral/backend:/code/mistral
      - ./projects/mistral/backend:/code/no_extended_project
      - ./projects/mistral/project_configuration.yaml:/code/confs/extended_project_configuration.yaml
      - ./projects/mistral/restapi:/usr/local/lib/python3.10/dist-packages/restapi
      - ./submodules/http-api:/http-api-package
      - ./submodules/http-api/tests:/code/tests
      - ./projects/mistral/backend/tests:/code/tests/custom
      - ./data/logs:/logs
      - ./projects/mistral/backend/cron:/etc/cron.rapydo
      - ./data/uploads:/uploads
      - ./data/user_repo:/data
      - ./data/opendata:/opendata
      - ./projects/mistral/scripts:/scripts
      - ./data/arkimet:/arkimet/datasets
      - ./data/arkimet_conf:/arkimet/config

  celery:
    build:
      args:
        CURRENT_GID: ${CURRENT_GID}
        CURRENT_UID: ${CURRENT_UID}
        RAPYDO_VERSION: ${RAPYDO_VERSION}
      context: ./projects/mistral/builds/backend
    command:
      - celery
      - --app
      - restapi.connectors.celery.worker.celery_app
      - worker
      - --concurrency=1
      - --pool=prefork
      - -Ofair
      - -Q
      - celery
      - -n
      - mistral-%h
    entrypoint:
      - docker-entrypoint-celery
    environment:
      ACTIVATE: ${ACTIVATE_CELERY:-'1'}

      ALCHEMY_DB: ${ALCHEMY_DB:-SQL_API}
      ALCHEMY_DBTYPE: ${ALCHEMY_DBTYPE:-postgresql}
      ALCHEMY_ENABLE: ${ALCHEMY_ENABLE:-'1'}
      ALCHEMY_ENABLE_CONNECTOR: ${ALCHEMY_ENABLE_CONNECTOR:-1}
      ALCHEMY_EXPIRATION_TIME: ${ALCHEMY_EXPIRATION_TIME:-7200}
      ALCHEMY_HOST: ${ALCHEMY_HOST:-sql.dockerized.io}
      ALCHEMY_PORT: ${ALCHEMY_PORT:-5432}
      ALCHEMY_USER: ${ALCHEMY_USER:-sqluser}
      ALCHEMY_PASSWORD: ${ALCHEMY_PASSWORD:?ALCHEMY_PASSWORD is required}
      ALCHEMY_POOLSIZE: ${ALCHEMY_POOLSIZE:-30}
      ALCHEMY_VERIFICATION_TIME: ${ALCHEMY_VERIFICATION_TIME:-900}

      APP_MODE: ${APP_MODE:?APP_MODE is required}
      APP_SECRETS: ${APP_SECRETS:?APP_SECRETS is required}
      BACKEND_PREFIX: ${BACKEND_PREFIX}
      BACKEND_URL: ${BACKEND_URL}
      BUILD: 6093ae53

      CELERYBEAT_ENABLED: ${CELERYBEAT_ENABLED:-1}
      CELERY_BACKEND_SERVICE: ${CELERY_BACKEND}
      CELERY_BROKER_SERVICE: ${CELERY_BROKER}
      CELERY_ENABLE: ${CELERY_ENABLE:-1}
      CELERY_EXPIRATION_TIME: ${CELERY_EXPIRATION_TIME:-7200}
      CELERY_VERIFICATION_TIME: ${CELERY_VERIFICATION_TIME:-900}

      CURRENT_GID: ${CURRENT_GID}
      CURRENT_UID: ${CURRENT_UID}
      DATA_PATH: ${DATA_PATH:-/data}
      DOMAIN: ${PROJECT_DOMAIN}
      EXTENDED_PACKAGE: no_extended_project
      FILE_LOGLEVEL: ${FILE_LOGLEVEL:-WARNING}
      FORCE_PRODUCTION_TESTS: ${FORCE_PRODUCTION_TESTS:-0}
      FRONTEND_PREFIX: ${FRONTEND_PREFIX}
      FRONTEND_URL: ${FRONTEND_URL}

      FTP_ENABLE: ${FTP_ENABLE:-0}
      FTP_ENABLE_CONNECTOR: ${FTP_ENABLE_CONNECTOR:-0}
      FTP_EXPIRATION_TIME: ${FTP_EXPIRATION_TIME:-7200}
      FTP_HOST: ${FTP_HOST:-ftp.dockerized.io}
      FTP_PORT: ${FTP_PORT:-21}
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD: ${FTP_PASSWORD}
      FTP_SSL_ENABLED: ${FTP_SSL_ENABLED:-0}
      FTP_VERIFICATION_TIME: ${FTP_VERIFICATION_TIME:-3600}

      GRACE_PERIOD: ${GRACE_PERIOD:-1800}
      LASTDAYS: ${LASTDAYS:-10}
      LOGURU_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_RETENTION: ${LOG_RETENTION:-180}

      NEO4J_ENABLE: ${NEO4J_ENABLE:-0}
      NEO4J_ENABLE_CONNECTOR: ${NEO4J_ENABLE_CONNECTOR:-0}
      NEO4J_EXPIRATION_TIME: ${NEO4J_EXPIRATION_TIME:-7200}
      NEO4J_HOST: ${NEO4J_HOST:-neo4j.dockerized.io}
      NEO4J_PORT: ${NEO4J_PORT:-7687}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_VERIFICATION_TIME: ${NEO4J_VERIFICATION_TIME:-900}

      PLATFORM: ${PLATFORM}
      PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}

      RABBITMQ_ENABLE: ${RABBITMQ_ENABLE:-1}
      RABBITMQ_ENABLE_CONNECTOR: ${RABBITMQ_ENABLE_CONNECTOR:-1}
      RABBITMQ_EXPIRATION_TIME: ${RABBITMQ_EXPIRATION_TIME:-7200}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbit.dockerized.io}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_SSL_ENABLED: ${RABBITMQ_SSL_ENABLED:-0}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_VERIFICATION_TIME: ${RABBITMQ_VERIFICATION_TIME:-900}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}

      REDIS_ENABLE: ${REDIS_ENABLE:-1}
      REDIS_ENABLE_CONNECTOR: ${REDIS_ENABLE_CONNECTOR:-1}
      REDIS_EXPIRATION_TIME: ${REDIS_EXPIRATION_TIME:-86400}
      REDIS_HOST: ${REDIS_HOST:-redis.dockerized.io}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_VERIFICATION_TIME: ${REDIS_VERIFICATION_TIME:-3600}

      SMTP_ADMIN: ${SMTP_ADMIN:?SMTP_ADMIN is required}
      SMTP_ENABLE: ${SMTP_ENABLE:-1}
      SMTP_ENABLE_CONNECTOR: ${SMTP_ENABLE_CONNECTOR:-1}
      SMTP_EXPIRATION_TIME: ${SMTP_EXPIRATION_TIME:-7200}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_NOREPLY: ${SMTP_NOREPLY}
      SMTP_REPLYTO: ${SMTP_REPLYTO}
      SMTP_VERIFICATION_TIME: ${SMTP_VERIFICATION_TIME:-900}

      SSL_FORCE_SELF_SIGNED: ${SSL_FORCE_SELF_SIGNED}
    healthcheck:
      interval: 1m0s
      retries: 3
      start_period: 5m0s
      test: ["CMD-SHELL", "/usr/local/bin/celery-healthcheck"]
      timeout: 10s
    image: meteohub/backend:${RAPYDO_VERSION}
    logging:
      driver: json-file
    restart: always
    volumes:
      - ./submodules/do/controller/confs/projects_defaults.yaml:/code/confs/projects_defaults.yaml
      - ./projects/mistral/project_configuration.yaml:/code/confs/project_configuration.yaml
      - ssl_certs:/etc/letsencrypt
      - ./projects/mistral/backend:/code/mistral
      - ./projects/mistral/backend:/code/no_extended_project
      - ./projects/mistral/project_configuration.yaml:/code/confs/extended_project_configuration.yaml
      - ./projects/mistral/restapi:/usr/local/lib/python3.10/dist-packages/restapi
      - ./data/logs:/logs
      - ./data/uploads:/uploads
      - ./data/user_repo:/data
      - ./data/opendata:/opendata
    working_dir: /code

  celerybeat:
    build:
      args:
        CURRENT_GID: ${CURRENT_GID}
        CURRENT_UID: ${CURRENT_UID}
        RAPYDO_VERSION: ${RAPYDO_VERSION}
      context: ./projects/mistral/builds/backend
    command:
      - celery
      - --app
      - restapi.connectors.celery.beat.celery_app
      - beat
      - --pidfile
      - /tmp/celerybeat.pid
      - --loglevel
      - DEBUG
      - --max-interval
      - "30"
      - --scheduler
      - redbeat.RedBeatScheduler
    entrypoint:
      - docker-entrypoint-celery
    environment:
      ACTIVATE: ${ACTIVATE_CELERYBEAT:-'1'}

      APP_MODE: ${APP_MODE}
      APP_SECRETS: ${APP_SECRETS:?APP_SECRETS is required}
      BACKEND_PREFIX: ${BACKEND_PREFIX}
      BACKEND_URL: ${BACKEND_URL}

      CELERYBEAT_ENABLED: "1"
      CELERYBEAT_SCHEDULER: ${CELERYBEAT_SCHEDULER}
      CELERY_BACKEND_SERVICE: ${CELERY_BACKEND}
      CELERY_BROKER_SERVICE: ${CELERY_BROKER}
      CELERY_ENABLE: "1"

      CURRENT_GID: ${CURRENT_GID}
      CURRENT_UID: ${CURRENT_UID}
      DOMAIN: ${PROJECT_DOMAIN}
      EXTENDED_PACKAGE: no_extended_project
      FILE_LOGLEVEL: ${FILE_LOGLEVEL}
      FRONTEND_PREFIX: ${FRONTEND_PREFIX}
      FRONTEND_URL: ${FRONTEND_URL}
      LOGURU_LEVEL: DEBUG
      LOG_RETENTION: ${LOG_RETENTION}
      PROJECT_NAME: ${COMPOSE_PROJECT_NAME}

      RABBITMQ_ENABLE: "1"
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_SSL_ENABLED: ${RABBITMQ_SSL_ENABLED}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}

      REDIS_ENABLE: "1"
      REDIS_ENABLE_CONNECTOR: ${REDIS_ENABLE_CONNECTOR}
      REDIS_EXPIRATION_TIME: ${REDIS_EXPIRATION_TIME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_VERIFICATION_TIME: ${REDIS_VERIFICATION_TIME}

      SMTP_ADMIN: ${SMTP_ADMIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_NOREPLY: ${SMTP_NOREPLY}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_REPLYTO: ${SMTP_REPLYTO}
      SMTP_USERNAME: ${SMTP_USERNAME}

      SSL_FORCE_SELF_SIGNED: ${SSL_FORCE_SELF_SIGNED}
    healthcheck:
      interval: 1m0s
      retries: 3
      start_period: 5m0s
      test: ["CMD-SHELL", "pgrep --pidfile /tmp/celerybeat.pid"]
      timeout: 10s
    hostname: celery-beat
    image: meteohub/backend:${RAPYDO_VERSION}
    logging:
      driver: json-file
    restart: always
    volumes:
      - ./submodules/do/controller/confs/projects_defaults.yaml:/code/confs/projects_defaults.yaml
      - ./projects/mistral/project_configuration.yaml:/code/confs/project_configuration.yaml
      - ssl_certs:/etc/letsencrypt
      - ./projects/mistral/backend:/code/mistral
      - ./projects/mistral/backend:/code/no_extended_project
      - ./projects/mistral/project_configuration.yaml:/code/confs/extended_project_configuration.yaml
      - ./projects/mistral/restapi:/usr/local/lib/python3.10/dist-packages/restapi
      - ./data/logs:/logs
    working_dir: /code

  operational_forecast_celery:
    <<: *celery-worker
    command:
      - celery
      - --app
      - restapi.connectors.celery.worker.celery_app
      - worker
      - --concurrency=1
      - -Ofair
      - -Q
      - operational_forecast
      - -n
      - mistral-%h
    environment:
      <<: *celery-worker-environment
      ALCHEMY_ENABLE: "1"
      BACKEND_PREFIX: ${BACKEND_PREFIX}
      BACKEND_URL: ${BACKEND_URL}

  operational_observed_celery:
    <<: *celery-worker
    command:
      - celery
      - --app
      - restapi.connectors.celery.worker.celery_app
      - worker
      - --concurrency=1
      - -Ofair
      - -Q
      - operational_observed
      - -n
      - mistral-%h
    environment:
      <<: *celery-worker-environment
      ALCHEMY_ENABLE: "1"
      BACKEND_PREFIX: ${BACKEND_PREFIX}
      BACKEND_URL: ${BACKEND_URL}

  postgres:
    build:
      args:
        CURRENT_GID: ${CURRENT_GID}
        CURRENT_UID: ${CURRENT_UID}
        RAPYDO_VERSION: ${RAPYDO_VERSION}
      context: ./submodules/build-templates/postgres
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - wal_buffers=16MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_io_concurrency=1
      - -c
      - max_worker_processes=1
      - -c
      - max_parallel_workers=1
    environment:
      ACTIVATE: "1"
      CURRENT_GID: ${CURRENT_GID}
      CURRENT_UID: ${CURRENT_UID}

      PGDATA: /var/lib/postgresql/current
      POSTGRES_DBS: ${ALCHEMY_DBS:-SQL_API}
      POSTGRES_DEFAULT_DB: ${ALCHEMY_DB:-SQL_API}
      POSTGRES_USER: ${ALCHEMY_USER:-sqluser}
      POSTGRES_PASSWORD: ${ALCHEMY_PASSWORD:?ALCHEMY_PASSWORD is required}

    healthcheck:
      interval: 1m0s
      retries: 3
      start_period: 5m0s
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DEFAULT_DB"',
        ]
      timeout: 20s
    image: rapydo/postgres:2.4
    logging:
      driver: json-file
    networks:
      default:
        aliases:
          - sql.dockerized.io
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - sqldata:/var/lib/postgresql
      - ./data/backup:/backup

  rabbit:
    build:
      args:
        CURRENT_GID: ${CURRENT_GID}
        CURRENT_UID: ${CURRENT_UID}
        RAPYDO_VERSION: ${RAPYDO_VERSION}
      context: ./submodules/build-templates/rabbitmq
    environment:
      ACTIVATE: "1"
      DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_ENABLE_SHOVEL_PLUGIN: ${RABBITMQ_ENABLE_SHOVEL_PLUGIN:-0}
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SSL_CACERTFILE: ${RABBITMQ_SSL_CACERTFILE:-}
      SSL_CERTFILE: ${RABBITMQ_SSL_CERTFILE:-}
      SSL_FAIL_IF_NO_PEER_CERT: ${RABBITMQ_SSL_FAIL_IF_NO_PEER_CERT:-}
      SSL_KEYFILE: ${RABBITMQ_SSL_KEYFILE:-}
    healthcheck:
      interval: 1m0s
      retries: 3
      start_period: 5m0s
      test: ["CMD-SHELL", "rabbitmq-diagnostics status"]
      timeout: 10s
    hostname: rabbit
    image: rapydo/rabbitmq:2.4
    logging:
      driver: json-file
    networks:
      default:
        aliases:
          - rabbit.dockerized.io
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ssl_certs:/ssl
      - ./data/backup:/backup

  redis:
    build:
      args:
        CURRENT_GID: ${CURRENT_GID}
        CURRENT_UID: ${CURRENT_UID}
        RAPYDO_VERSION: ${RAPYDO_VERSION}
      context: ./submodules/build-templates/redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      ACTIVATE: "1"
      CURRENT_GID: ${CURRENT_GID}
      CURRENT_UID: ${CURRENT_UID}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      interval: 1m0s
      retries: 3
      start_period: 5m0s
      test:
        ["CMD-SHELL", 'redis-cli --pass "$$REDIS_PASSWORD" -h 127.0.0.1 ping']
      timeout: 10s
    image: rapydo/redis:2.4
    logging:
      driver: json-file
    networks:
      default:
        aliases:
          - redis.dockerized.io
    restart: always
    volumes:
      - redisdata:/data
      - ./data/backup:/backup

  strapi:
    depends_on:
      strapiDB:
        condition: service_started
        required: true
    environment:
      ACTIVATE: "1"
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET:?CMS_ADMIN_JWT_SECRET is required}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT:?CMS_API_TOKEN_SALT is required}
      APP_KEYS: ${CMS_APP_KEYS:?CMS_APP_KEYS is required}
      DATABASE_CLIENT: ${CMS_DATABASE_CLIENT:-postgres}
      DATABASE_FILENAME: ${CMS_DATABASE_FILENAME:-}
      DATABASE_HOST: strapiDB
      DATABASE_NAME: ${CMS_DATABASE_NAME:-strapi}
      DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD:?CMS_DATABASE_PASSWORD is required}
      DATABASE_PORT: ${CMS_DATABASE_PORT:-5432}
      DATABASE_SSL: ${CMS_DATABASE_SSL:-false}
      DATABASE_USERNAME: ${CMS_DATABASE_USERNAME:-sqluser}
      DATA_PATH: ${DATA_PATH:-/data}
      DB_PATH_RELATIVE: ${CMS_DB_PATH_RELATIVE:-database}
      ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:?CMS_ENCRYPTION_KEY is required}
      HOST: ${CMS_HOST:-0.0.0.0}
      PORT: ${CMS_PORT:-1337}
      JWT_SECRET: ${CMS_JWT_SECRET:?CMS_JWT_SECRET is required}
      NODE_ENV: production
      START_MODE: develop
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT:?CMS_TRANSFER_TOKEN_SALT is required}
      UPLOAD_PATH_RELATIVE: ${CMS_UPLOAD_PATH_RELATIVE:-uploads}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 120s
      test: [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:" + (process.env.PORT || "1337") + "/_health",
          { signal: AbortSignal.timeout(5000) })
          .then(r => process.exit(r.status === 204 ? 0: 1))
          .catch(e => { console.error(e.message); process.exit(1); })',
        ]
      timeout: 10s
    image: harbor-ada.hpc.cineca.it/meteo-hub-staging/meteo-hub-strapi:latest
    ports:
      - "1337:1337"
    restart: unless-stopped
    volumes:
      - ./data/strapi/uploads:/opt/app/public/uploads

  strapiDB:
    container_name: strapiDB
    environment:
      ACTIVATE: "1"
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET:?CMS_ADMIN_JWT_SECRET is required}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT:?CMS_API_TOKEN_SALT is required}
      APP_KEYS: ${CMS_APP_KEYS:?CMS_APP_KEYS is required}
      DATABASE_CLIENT: ${CMS_DATABASE_CLIENT:-postgres}
      DATABASE_FILENAME: ${CMS_DATABASE_FILENAME:-}
      DATABASE_HOST: ${CMS_DATABASE_HOST:-127.0.0.1}
      DATABASE_NAME: ${CMS_DATABASE_NAME:-strapi}
      DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD:?CMS_DATABASE_PASSWORD is required}
      DATABASE_PORT: ${CMS_DATABASE_PORT:-5432}
      DATABASE_SSL: ${CMS_DATABASE_SSL:-false}
      DATABASE_USERNAME: ${CMS_DATABASE_USERNAME:-sqluser}
      ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:?CMS_ENCRYPTION_KEY is required}
      HOST: 127.0.0.1
      JWT_SECRET: ${CMS_JWT_SECRET:?CMS_JWT_SECRET is required}
      PORT: "5432"
      POSTGRES_DB: ${CMS_DATABASE_NAME}
      POSTGRES_PASSWORD: ${CMS_DATABASE_PASSWORD:?CMS_DATABASE_PASSWORD is required}
      POSTGRES_USER: ${CMS_DATABASE_USERNAME}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT:?CMS_TRANSFER_TOKEN_SALT is required}
    expose:
      - "5432"
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      timeout: 5s
    image: postgres:16.0-alpine
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./data/strapi/database:/var/lib/postgresql/data

  swaggerui:
    build:
      args:
        CURRENT_GID: ${CURRENT_GID}
        CURRENT_UID: ${CURRENT_UID}
        RAPYDO_VERSION: ${RAPYDO_VERSION}
      context: ./submodules/build-templates/swaggerui
    environment:
      ACTIVATE: ${ACTIVATE_SWAGGERUI:-1}
      APP_MODE: ${APP_MODE:?APP_MODE is required}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      DOMAIN: ${PROJECT_DOMAIN}
      PROJECT_TITLE: ${PROJECT_TITLE:-localhost}
    image: rapydo/swaggerui:2.4
    logging:
      driver: json-file
    ports:
      - "${SWAGGERUI_PORT:-7777}:8080"
    volumes:
      - ssl_certs:/etc/letsencrypt
  ui:
    environment:
      ACTIVATE: ${ACTIVATE_UI:-1}
      PORT: "4200"
    image: harbor-ada.hpc.cineca.it/meteo-hub-staging/meteo-cms-ui:latest
    ports:
      - "${UI_PORT:-4200}:4200"
    restart: unless-stopped

volumes:
  data_imports:
    name: mistral_data_imports
  rabbitdata:
    name: mistral_rabbitdata
  redisdata:
    name: mistral_redisdata
  secrets:
    name: mistral_secrets
  sqldata:
    name: mistral_sqldata
  ssl_certs:
    name: mistral_ssl_certs
